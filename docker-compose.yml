version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: semantic_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: semantic_memory
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d semantic_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

