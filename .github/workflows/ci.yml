name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Validate Pydantic Schemas and Engine Imports
      run: |
        python -c "from app.models.schemas import ChatRequest, ChatResponse; print('Schemas OK')"
        python -c "from app.config import settings; print('Config OK')"
        python -c "from app.services.prompt_templates import build_query_resolution_prompt; print('Prompts OK')"

